packages:
  - '.'

dangerouslyAllowAllBuilds: true

allowBuilds:
  esbuild: true
  workerd: true
  '@cloudflare/workerd-linux-64': true
  '@cloudflare/workerd-darwin-arm64': true
  '@cloudflare/workerd-darwin-64': true
  '@cloudflare/workerd-windows-64': true
  sharp: true

onlyBuiltDependencies:
  - '@cloudflare/workerd-darwin-64'
  - '@cloudflare/workerd-darwin-arm64'
  - '@cloudflare/workerd-linux-64'
  - '@cloudflare/workerd-windows-64'
  - esbuild
  - sharp
  - workerd

pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next
  - lenis@1.3.28
  - '@cloudflare/workers-utils@0.57.0'
  - miniflare@5.20261123.1-beta
  - wrangler@4.168.0
